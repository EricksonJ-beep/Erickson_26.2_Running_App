# Builds the native Android shell (Capacitor, Phase 2) into a sideloadable APK.
# Run it from the Actions tab ("Run workflow") or by pushing an android-v* tag;
# the APK appears as a downloadable artifact on the run page. A tag build also
# attaches the APK (as erickson-26.2.apk) to the GitHub Release for that tag,
# creating the release if it doesn't exist yet - that's the phone install link.
# "Run workflow" can do the same by filling in the release_tag input.
#
# Signing: uses android/signing/erickson-release.keystore with the
# KEYSTORE_PASSWORD repo secret. Without the secret the build still passes but
# the APK is unsigned (not installable) — set the secret before a real release.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also publish: create/upload the GitHub Release for this tag (e.g. android-v0.6.0). Tags the built commit if the tag doesn't exist yet. Leave blank for an artifact-only build."
        required: false
        default: ""
  push:
    tags: ["android-v*"]

permissions:
  contents: write # create/upload the GitHub Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: erickson-26-2/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: erickson-26-2
        run: npm ci

      - name: Sync Capacitor
        working-directory: erickson-26-2
        run: npx cap sync android

      - name: Build APK
        working-directory: erickson-26-2/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            export KEYSTORE_FILE="$GITHUB_WORKSPACE/erickson-26-2/android/signing/erickson-release.keystore"
            export KEY_ALIAS=erickson262
            export KEY_PASSWORD="$KEYSTORE_PASSWORD"
            echo "Signing with the release keystore."
          else
            echo "::warning::KEYSTORE_PASSWORD secret not set - building an UNSIGNED apk (toolchain check only, not installable)."
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: erickson-26-2-apk
          path: erickson-26-2/android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release (tag builds, or release_tag input)
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          apk=$(ls erickson-26-2/android/app/build/outputs/apk/release/app-release*.apk | head -n1)
          cp "$apk" erickson-26.2.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" erickson-26.2.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" erickson-26.2.apk \
              --target "$GITHUB_SHA" \
              --title "Erickson 26.2 — Android ${TAG#android-v}" \
              --notes "Install: tap erickson-26.2.apk, open the download, Install. Updates the previous version in place - your data stays." \
              --repo "$GITHUB_REPOSITORY"
          fi
